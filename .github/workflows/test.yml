name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Maintenance style checks
        run: git diff --check
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff format --check scripts tests
      - name: Test local tools
        run: python -m unittest discover -s tests -v
      - name: Build explicit release package
        run: python scripts/build_release.py --output "${{ runner.temp }}/ketang-zhongdian.zip"
